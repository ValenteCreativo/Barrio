# docker-compose.yml
# Levanta SQL Server 2025 (Developer Edition) y despliega el esquema de
# BARRIO automaticamente. Pensado para correr tanto en local como dentro de
# un Docker Sandbox (microVM con motor Docker completo).
#
# IMPORTANTE: la contrasena de SA se lee de la variable de entorno
# MSSQL_SA_PASSWORD (definida en un archivo .env NO versionado). Nunca la
# escribas aqui ni la subas a git.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: barrio-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - barrio_sql_data:/var/opt/mssql
    healthcheck:
      # Verificacion por TCP (no depende de que sqlcmd este instalado dentro
      # de la imagen de SQL Server/Azure SQL Edge, que varia entre ellas).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  deploy-schema:
    image: mcr.microsoft.com/mssql-tools
    container_name: barrio-deploy-schema
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    entrypoint: ["/bin/bash", "/scripts-entry/deploy.sh"]
    volumes:
      - ../sql:/scripts:ro
      - ./deploy.sh:/scripts-entry/deploy.sh:ro

volumes:
  barrio_sql_data:
